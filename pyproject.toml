[project]
name = "watchtower"
version = "0.1.0"
description = "Self-hosted page-change watcher — schedule checks, get notified when a page changes"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "bcrypt>=4.0",
    "pyjwt>=2.9",
    "apscheduler>=3.10",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "slowapi>=0.1.9",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/watchtower"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff.lint]
# B008 flags `Depends(...)` in function defaults as a bug — that's FastAPI's
# required dependency-injection idiom, not a mistake, so it's silenced here.
ignore = ["B008"]
